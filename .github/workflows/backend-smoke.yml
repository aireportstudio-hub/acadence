name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/test-services.ps1"
      - ".github/workflows/backend-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/test-services.ps1"
      - ".github/workflows/backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-orchestration-service
          - auth-service
          - billing-service
          - document-service
          - notification-service
          - project-service
          - quality-service
          - template-service
          - visual-ai-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install service development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Run service unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  backend-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check all nine backend services
        shell: pwsh
        run: ./scripts/test-services.ps1